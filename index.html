<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Alteo</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#08090c;
  --panel:#101116;
  --panel2:#15171e;
  --border:#242731;
  --text:#f5f7fb;
  --muted:#8d93a1;
  --accent:#7c5cff;
  --accent2:#9d87ff;
  --danger:#ff5f6d;
  --success:#49d17d;
  --radius:20px;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#toast{
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translate(-50%,20px);
  background:#181a22;
  border:1px solid #30333e;
  color:white;
  padding:13px 18px;
  border-radius:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s ease;
  z-index:9999;
  box-shadow:0 15px 50px #0008;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* AUTH */

#auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:
    radial-gradient(circle at 20% 10%,#7c5cff18,transparent 35%),
    radial-gradient(circle at 90% 80%,#5c9cff10,transparent 30%),
    var(--bg);
}

.auth-card{
  width:min(440px,100%);
  background:#101116eF;
  border:1px solid var(--border);
  border-radius:28px;
  padding:32px;
  box-shadow:0 30px 100px #0008;
  backdrop-filter:blur(25px);
  animation:authIn .5s ease;
}

@keyframes authIn{
  from{opacity:0;transform:translateY(20px) scale(.98)}
  to{opacity:1;transform:none}
}

.logo{
  font-size:31px;
  font-weight:850;
  letter-spacing:-1.5px;
}

.logo span{
  color:var(--accent2);
}

.auth-sub{
  color:var(--muted);
  margin:8px 0 28px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#090a0d;
  border:1px solid var(--border);
  padding:4px;
  border-radius:13px;
  margin-bottom:20px;
}

.auth-tab{
  background:transparent;
  color:var(--muted);
  padding:10px;
  border-radius:9px;
}

.auth-tab.active{
  color:white;
  background:#1a1c24;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:13px;
  color:#aeb3bf;
  margin-bottom:7px;
}

.field input,
.field textarea,
.search-input,
.message-input{
  width:100%;
  border:1px solid var(--border);
  outline:none;
  color:white;
  background:#0b0c10;
  border-radius:13px;
  padding:13px 14px;
  transition:.2s;
}

.field textarea{
  resize:vertical;
  min-height:100px;
}

.field input:focus,
.field textarea:focus,
.search-input:focus,
.message-input:focus{
  border-color:#6955cf;
  box-shadow:0 0 0 3px #7c5cff12;
}

.primary{
  width:100%;
  padding:13px;
  border-radius:13px;
  background:var(--accent);
  color:white;
  font-weight:750;
  transition:.2s;
}

.primary:hover{
  background:#8b72ff;
  transform:translateY(-1px);
}

.google{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:13px;
  background:#171920;
  color:white;
  border:1px solid var(--border);
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:18px 0;
  color:#686d79;
  font-size:12px;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  flex:1;
  background:var(--border);
}

.error{
  color:#ff7b87;
  font-size:13px;
  margin:10px 0;
}

/* APP */

#app{
  min-height:100vh;
}

.layout{
  display:grid;
  grid-template-columns:240px minmax(0,680px) 300px;
  justify-content:center;
  gap:24px;
  max-width:1300px;
  margin:auto;
  padding:20px;
}

.sidebar{
  position:sticky;
  top:20px;
  height:calc(100vh - 40px);
  display:flex;
  flex-direction:column;
}

.side-logo{
  padding:10px 13px 25px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav-btn{
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  color:#aeb3bf;
  background:transparent;
  padding:12px 14px;
  border-radius:13px;
  text-align:left;
  transition:.2s;
}

.nav-btn:hover,
.nav-btn.active{
  color:white;
  background:#15171e;
}

.nav-btn.active svg{
  color:var(--accent2);
}

.nav-bottom{
  margin-top:auto;
}

.main{
  min-width:0;
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  padding:10px 0 15px;
  background:linear-gradient(#08090c 70%,transparent);
}

.page-title{
  font-size:25px;
  font-weight:800;
  letter-spacing:-.8px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
}

.composer{
  padding:18px;
  margin-bottom:14px;
}

.composer-row{
  display:flex;
  gap:12px;
}

.avatar{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:50%;
  background:linear-gradient(135deg,#2a2d37,#171920);
  display:grid;
  place-items:center;
  overflow:hidden;
  font-weight:800;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.composer textarea{
  flex:1;
  min-height:65px;
  background:transparent;
  border:0;
  outline:0;
  resize:none;
  color:white;
  font-size:16px;
}

.composer-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid var(--border);
  padding-top:12px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.small-btn{
  padding:9px 14px;
  border-radius:11px;
  background:var(--accent);
  color:white;
  font-weight:700;
}

.post{
  padding:17px;
  margin-bottom:14px;
  animation:postIn .3s ease;
}

@keyframes postIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

.post-head{
  display:flex;
  gap:11px;
  align-items:center;
}

.post-user{
  flex:1;
  min-width:0;
}

.post-name{
  font-weight:750;
  cursor:pointer;
}

.post-handle{
  color:var(--muted);
  font-size:12px;
}

.post-time{
  color:#696e7a;
  font-size:12px;
}

.more-btn{
  color:#858a96;
  background:transparent;
  padding:5px;
}

.post-text{
  white-space:pre-wrap;
  word-break:break-word;
  margin:14px 0;
  line-height:1.5;
}

.post-image{
  width:100%;
  max-height:560px;
  object-fit:contain;
  background:#08090c;
  border-radius:15px;
  border:1px solid var(--border);
}

.post-actions{
  display:flex;
  gap:5px;
  margin-top:10px;
  border-top:1px solid var(--border);
  padding-top:8px;
}

.action{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:#858b99;
  background:transparent;
  padding:9px;
  border-radius:10px;
  transition:.2s;
}

.action:hover{
  background:#181a21;
  color:white;
}

.action.liked{
  color:#ff6075;
}

.right{
  position:sticky;
  top:20px;
  height:max-content;
}

.right-card{
  padding:17px;
  margin-bottom:14px;
}

.right-title{
  font-weight:800;
  margin-bottom:13px;
}

/* PROFILE */

.profile-cover{
  height:140px;
  border-radius:20px 20px 0 0;
  background:
    radial-gradient(circle at 20% 20%,#9b82ff,transparent 35%),
    radial-gradient(circle at 80% 80%,#485cff,transparent 35%),
    #15171f;
}

.profile-info{
  padding:0 20px 20px;
}

.profile-avatar{
  width:88px;
  height:88px;
  margin-top:-44px;
  border:4px solid var(--panel);
  border-radius:50%;
  overflow:hidden;
  background:#22252d;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:24px;
  font-weight:850;
  margin-top:10px;
}

.profile-handle{
  color:var(--muted);
}

.profile-bio{
  margin-top:12px;
  color:#c8ccd5;
  line-height:1.45;
}

.stats{
  display:flex;
  gap:25px;
  margin-top:17px;
}

.stat strong{
  display:block;
}

.stat span{
  color:var(--muted);
  font-size:13px;
}

.profile-actions{
  display:flex;
  gap:8px;
  margin-top:17px;
}

.outline-btn{
  border:1px solid var(--border);
  background:#15171e;
  color:white;
  padding:10px 15px;
  border-radius:11px;
  font-weight:700;
}

.outline-btn.following{
  background:var(--accent);
  border-color:var(--accent);
}

/* SEARCH */

.search-box{
  margin-bottom:15px;
}

.search-results{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.user-result{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-radius:14px;
  background:#101116;
  border:1px solid var(--border);
  cursor:pointer;
}

.user-result:hover{
  background:#161820;
}

.user-info{
  flex:1;
}

.user-display{
  font-weight:750;
}

.user-handle{
  color:var(--muted);
  font-size:13px;
}

/* NOTIFICATIONS */

.notification{
  display:flex;
  gap:12px;
  padding:14px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.notification:last-child{
  border-bottom:0;
}

.notification.unread{
  background:#14121e;
}

.notification-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--accent);
  margin-top:8px;
}

/* MESSAGES */

.messages-layout{
  display:grid;
  grid-template-columns:230px 1fr;
  min-height:620px;
  overflow:hidden;
}

.conversations{
  border-right:1px solid var(--border);
  overflow:auto;
}

.conversation{
  padding:13px;
  display:flex;
  gap:10px;
  cursor:pointer;
}

.conversation:hover,
.conversation.active{
  background:#171920;
}

.chat{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-head{
  padding:15px;
  border-bottom:1px solid var(--border);
  font-weight:800;
}

.messages{
  flex:1;
  padding:15px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.message{
  max-width:75%;
  padding:10px 13px;
  border-radius:16px;
  background:#191b23;
  width:max-content;
  line-height:1.4;
}

.message.mine{
  margin-left:auto;
  background:var(--accent);
}

.message-time{
  opacity:.55;
  font-size:10px;
  margin-top:4px;
}

.message-send{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid var(--border);
}

.message-input{
  flex:1;
}

.send-btn{
  width:45px;
  border-radius:12px;
  background:var(--accent);
  color:white;
}

/* MODAL */

.modal-wrap{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:#0009;
  backdrop-filter:blur(8px);
}

.modal{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  background:#111218;
  border:1px solid #2b2e38;
  border-radius:22px;
  padding:20px;
  box-shadow:0 30px 100px #000b;
  animation:modalIn .25s ease;
}

@keyframes modalIn{
  from{opacity:0;transform:scale(.97) translateY(8px)}
  to{opacity:1;transform:none}
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.modal-title{
  font-size:19px;
  font-weight:800;
}

.close{
  width:34px;
  height:34px;
  border-radius:10px;
  background:#1a1c23;
  color:#aaa;
  display:grid;
  place-items:center;
}

/* COMMENTS */

.comment{
  display:flex;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid var(--border);
}

.comment:last-child{
  border-bottom:0;
}

.comment-body{
  flex:1;
}

.comment-name{
  font-weight:750;
}

.comment-text{
  color:#d0d3da;
  margin-top:3px;
  white-space:pre-wrap;
  word-break:break-word;
}

.comment-form{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.comment-form input{
  flex:1;
  background:#0b0c10;
  color:white;
  border:1px solid var(--border);
  padding:11px;
  border-radius:11px;
  outline:0;
}

/* MOBILE */

.mobile-nav{
  display:none;
}

@media(max-width:1050px){
  .layout{
    grid-template-columns:76px minmax(0,680px);
    justify-content:center;
  }

  .sidebar{
    align-items:center;
  }

  .side-logo{
    font-size:0;
  }

  .side-logo .logo{
    font-size:25px;
  }

  .nav-btn span{
    display:none;
  }

  .right{
    display:none;
  }
}

@media(max-width:700px){
  .layout{
    display:block;
    padding:0 10px 75px;
  }

  .sidebar{
    display:none;
  }

  .topbar{
    padding:14px 4px 12px;
  }

  .mobile-nav{
    display:flex;
    position:fixed;
    z-index:500;
    bottom:0;
    left:0;
    right:0;
    height:64px;
    background:#0d0e12f5;
    backdrop-filter:blur(20px);
    border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }

  .mobile-nav button{
    flex:1;
    background:transparent;
    color:#777d89;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .mobile-nav button.active{
    color:white;
  }

  .card{
    border-radius:17px;
  }

  .messages-layout{
    grid-template-columns:1fr;
    min-height:600px;
  }

  .conversations{
    display:none;
  }

  .profile-cover{
    height:110px;
  }

  .profile-avatar{
    width:76px;
    height:76px;
    margin-top:-38px;
  }

  .post{
    padding:14px;
  }

  .modal{
    border-radius:20px;
  }
}
</style>
</head>

<body>

<div id="toast"></div>

<!-- AUTH -->
<section id="auth">
  <div class="auth-card">

    <div class="logo">al<span>teo</span></div>
    <div class="auth-sub">A social place built around people.</div>

    <div class="auth-tabs">
      <button id="loginTab" class="auth-tab active">Log in</button>
      <button id="signupTab" class="auth-tab">Create account</button>
    </div>

    <form id="authForm">

      <div id="signupFields" class="hidden">

        <div class="field">
          <label>Username</label>
          <input id="signupUsername"
                 maxlength="20"
                 placeholder="yourname"
                 autocomplete="username">
        </div>

        <div class="field">
          <label>Display name</label>
          <input id="signupDisplayName"
                 maxlength="30"
                 placeholder="Your name">
        </div>

      </div>

      <div class="field">
        <label>Email</label>
        <input id="email"
               type="email"
               required
               autocomplete="email"
               placeholder="you@example.com">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="password"
               type="password"
               required
               minlength="6"
               autocomplete="current-password"
               placeholder="At least 6 characters">
      </div>

      <div id="authError" class="error"></div>

      <button id="authSubmit" class="primary">
        Log in
      </button>

    </form>

    <div class="divider">OR</div>

    <button id="googleBtn" class="google">
      Continue with Google
    </button>

  </div>
</section>


<!-- APP -->
<section id="app" class="hidden">

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="side-logo">
        <div class="logo">al<span>teo</span></div>
      </div>

      <nav class="nav">

        <button class="nav-btn active" data-page="home">
          <svg><use href="#i-home"></use></svg>
          <span>Home</span>
        </button>

        <button class="nav-btn" data-page="discover">
          <svg><use href="#i-search"></use></svg>
          <span>Discover</span>
        </button>

        <button class="nav-btn" data-page="notifications">
          <svg><use href="#i-bell"></use></svg>
          <span>Notifications</span>
        </button>

        <button class="nav-btn" data-page="messages">
          <svg><use href="#i-message"></use></svg>
          <span>Messages</span>
        </button>

        <button class="nav-btn" data-page="profile">
          <svg><use href="#i-user"></use></svg>
          <span>Profile</span>
        </button>

      </nav>

      <div class="nav nav-bottom">

        <button class="nav-btn" data-page="settings">
          <svg><use href="#i-settings"></use></svg>
          <span>Settings</span>
        </button>

        <button id="logoutBtn" class="nav-btn">
          <svg><use href="#i-logout"></use></svg>
          <span>Log out</span>
        </button>

      </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

      <header class="topbar">
        <div id="pageTitle" class="page-title">Home</div>
      </header>

      <!-- HOME -->
      <section id="page-home" class="page">

        <div class="card composer">

          <div class="composer-row">

            <div id="composerAvatar" class="avatar"></div>

            <textarea
              id="postText"
              maxlength="1000"
              placeholder="What's happening?"></textarea>

          </div>

          <div class="composer-bottom">

            <label class="muted" style="cursor:pointer">
              <input id="postImageInput"
                     type="file"
                     accept="image/*"
                     hidden>
              Add image
            </label>

            <div style="display:flex;gap:10px;align-items:center">
              <span id="postCount" class="muted">0/1000</span>
              <button id="publishBtn" class="small-btn">Post</button>
            </div>

          </div>

        </div>

        <div id="feed"></div>

      </section>


      <!-- DISCOVER -->
      <section id="page-discover" class="page hidden">

        <div class="search-box">
          <input
            id="userSearch"
            class="search-input"
            placeholder="Search people..."
            autocomplete="off">
        </div>

        <div id="searchResults" class="search-results"></div>

      </section>


      <!-- NOTIFICATIONS -->
      <section id="page-notifications" class="page hidden">

        <div class="card">

          <div style="padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
            <strong>Notifications</strong>
            <button id="markNotificationsRead"
                    class="outline-btn">
              Mark all read
            </button>
          </div>

          <div id="notificationsList"></div>

        </div>

      </section>


      <!-- MESSAGES -->
      <section id="page-messages" class="page hidden">

        <div class="card messages-layout">

          <div id="conversationList" class="conversations"></div>

          <div class="chat">

            <div id="chatHead" class="chat-head">
              Select a conversation
            </div>

            <div id="messagesList" class="messages">
              <div class="muted" style="text-align:center;margin:auto">
                Choose someone to start messaging.
              </div>
            </div>

            <form id="messageForm" class="message-send">

              <input
                id="messageInput"
                class="message-input"
                maxlength="2000"
                placeholder="Write a message..."
                disabled>

              <button class="send-btn" disabled>
                <svg><use href="#i-send"></use></svg>
              </button>

            </form>

          </div>

        </div>

      </section>


      <!-- PROFILE -->
      <section id="page-profile" class="page hidden">

        <div id="profileCard" class="card"></div>

        <div id="profilePosts" style="margin-top:14px"></div>

      </section>


      <!-- SETTINGS -->
      <section id="page-settings" class="page hidden">

        <div class="card" style="padding:20px">

          <h2 style="margin-top:0">Settings</h2>

          <button id="editProfileBtn"
                  class="outline-btn">
            Edit profile
          </button>

          <button id="settingsLogout"
                  class="outline-btn"

function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){

  return String(name || "U")
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();
}

         style="width:${size}px;height:${size}px;flex-basis:${size}px">

}

function timeAgo(timestamp){

  if(!timestamp) return "now";

  const date = timestamp.toDate
    ? timestamp.toDate()
    : new Date(timestamp);

  const seconds = Math.floor((Date.now()-date.getTime())/1000);

  if(seconds < 60) return "now";

  const minutes = Math.floor(seconds/60);
  if(minutes < 60) return `${minutes}m`;

  const hours = Math.floor(minutes/60);
  if(hours < 24) return `${hours}h`;

  const days = Math.floor(hours/24);
  if(days < 7) return `${days}d`;

  return date.toLocaleDateString();
}

/* AUTH */

$("authForm").addEventListener("submit",async e=>{

  e.preventDefault();

  const email = $("email").value.trim();
  const password = $("password").value;

  $("authError").textContent = "";

  try{

    if(authMode === "login"){

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }else{

      const username = $("signupUsername")
        .value
        .trim();

      const displayName = $("signupDisplayName")
        .value
        .trim();

      if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){
        throw new Error(
          "Username must be 3–20 characters using letters, numbers or underscores."
        );
      }

      if(displayName.length < 2 || displayName.length > 30){
        throw new Error(
          "Display name must be 2–30 characters."
        );
      }

      const usernameLower = username.toLowerCase();
      const displayNameLower = displayName
        .normalize("NFKC")
        .toLowerCase();

      const credential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      const uid = credential.user.uid;

      await runTransaction(db,async transaction=>{

        const usernameRef =
          doc(db,"usernames",usernameLower);

        const displayRef =
          doc(db,"displayNames",displayNameLower);

        const usernameSnap =
          await transaction.get(usernameRef);

        const displaySnap =
          await transaction.get(displayRef);

        if(usernameSnap.exists()){
          throw new Error("USERNAME_TAKEN");
        }

        if(displaySnap.exists()){
          throw new Error("DISPLAY_TAKEN");
        }

        transaction.set(usernameRef,{
          uid,
          username,
          createdAt:serverTimestamp()
        });

        transaction.set(displayRef,{
          uid,
          displayName,
          createdAt:serverTimestamp()
        });

        transaction.set(
          doc(db,"users",uid),
          {
            uid,
            username,
            usernameLower,
            displayName,
            displayNameLower,
            bio:"",
            photoURL:"",
            createdAt:serverTimestamp(),
            followersCount:0,
            followingCount:0,
            postsCount:0
          }
        );

      });

      await updateProfile(credential.user,{
        displayName
      });

      toast("Account created");

    }

  }catch(err){

    console.error(err);

    let message = err.message || "Something went wrong.";

    if(message === "USERNAME_TAKEN")
      message = "That username is already taken.";

    if(message === "DISPLAY_TAKEN")
      message = "That display name is already taken.";

    if(err.code === "auth/email-already-in-use")
      message = "That email is already registered.";

    if(err.code === "auth/invalid-credential")
      message = "Incorrect email or password.";

    if(err.code === "auth/popup-closed-by-user")
      message = "Google sign-in was cancelled.";

    $("authError").textContent = message;
  }
});

/* IMAGE COMPRESSION */

async function compressImage(file){

  if(file.size > 8 * 1024 * 1024){
    throw new Error(
      "Image must be smaller than 8 MB."
    );
  }

  const data =
    await new Promise((resolve,reject)=>{

      const reader = new FileReader();

      reader.onload =
        ()=>resolve(reader.result);

      reader.onerror =
        ()=>reject(new Error("Could not read image."));

      reader.readAsDataURL(file);

    });

  const img =
    await new Promise((resolve,reject)=>{

      const image = new Image();

      image.onload = ()=>resolve(image);

      image.onerror =
        ()=>reject(new Error("Invalid image."));

      image.src = data;

    });

  const max = 900;

  let width = img.width;
  let height = img.height;

  if(width > max || height > max){

    const ratio =
      Math.min(max/width,max/height);

    width = Math.round(width*ratio);
    height = Math.round(height*ratio);
  }

  const canvas =
    document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    img,
    0,
    0,
    width,
    height
  );

  let result =
    canvas.toDataURL("image/jpeg",.68);

  if(result.length > 700000){

    result =
      canvas.toDataURL("image/jpeg",.48);

  }

  if(result.length > 900000){

    throw new Error(
      "That image is too large after compression. Try a smaller image."
    );
  }

  return result;
}

  unsubFeed =
    onSnapshot(

        renderFeed(posts);

/* REAL LIKES */

async function toggleLike(postId){

  if(!currentUser) return;

  const likeRef =
    doc(
      db,
      "posts",
      postId,
      "likes",
      currentUser.uid
    );

  const postRef =
    doc(db,"posts",postId);

  try{

    await runTransaction(
      db,
      async transaction=>{

        const likeSnap =
          await transaction.get(likeRef);

        if(likeSnap.exists()){

          transaction.delete(likeRef);

          transaction.update(
            postRef,
            {
              likeCount:increment(-1)
            }
          );

        }else{

          transaction.set(
            likeRef,
            {
              uid:currentUser.uid,
              createdAt:serverTimestamp()
            }
          );

          transaction.update(
            postRef,
            {
              likeCount:increment(1)
            }
          );

        }

      }
    );

    const postSnap =
      await getDoc(postRef);

    if(postSnap.exists()){

      const post = postSnap.data();

      if(
        post.uid !== currentUser.uid
      ){

        const liked =
          await getDoc(likeRef);

        if(liked.exists()){

          await createNotification(
            post.uid,
            "like",
            `${currentProfile.displayName} liked your post.`,
            postId
          );

        }

      }

    }

  }catch(err){

    console.error(err);
    toast("Could not update like.");

  }
}

async function searchUsers(){

  const term =
    $("userSearch").value
      .trim()
      .toLowerCase();

  if(!term){

    $("searchResults").innerHTML = "";
    return;

  }

  try{

    const usernameQuery =
      query(
        collection(db,"users"),
        where(
          "usernameLower",
          ">=",
          term
        ),
        where(
          "usernameLower",
          "<=",
          term + "\uf8ff"
        ),
        limit(15)
      );

    const displayQuery =
      query(
        collection(db,"users"),
        where(
          "displayNameLower",
          ">=",
          term
        ),
        where(
          "displayNameLower",
          "<=",
          term + "\uf8ff"
        ),
        limit(15)
      );

    const [a,b] =
      await Promise.all([
        getDocs(usernameQuery),
        getDocs(displayQuery)
      ]);

    const map = new Map();

    [...a.docs,...b.docs].forEach(d=>{
      map.set(d.id,{
        id:d.id,
        ...d.data()
      });
    });

    const users =
      [...map.values()];

    $("searchResults").innerHTML =
      users.length
      ? users.map(user=>`

        <div class="user-result"
             onclick="window.openProfile('${user.id}')">

          ${avatarHTML(user)}

          <div class="user-info">

            <div class="user-display">
              ${esc(user.displayName)}
            </div>

            <div class="user-handle">
              @${esc(user.username)}
            </div>

          </div>

        </div>

      `).join("")
      : `
        <div class="muted"
             style="padding:20px;text-align:center">
          No users found.
        </div>
      `;

  }catch(err){

    console.error(err);

    $("searchResults").innerHTML = `
      <div class="error">
        Search failed. Firestore may require an index.
      </div>
    `;

  }

}

/* FOLLOW SYSTEM */

window.toggleFollow = async targetUid=>{

  if(targetUid === currentUser.uid)
    return;

  const followerRef =
    doc(
      db,
      "users",
      targetUid,
      "followers",
      currentUser.uid
    );

  const followingRef =
    doc(
      db,
      "users",
      currentUser.uid,
      "following",
      targetUid
    );

  try{

    await runTransaction(
      db,
      async transaction=>{

        const existing =
          await transaction.get(followerRef);

        if(existing.exists()){

          transaction.delete(followerRef);
          transaction.delete(followingRef);

          transaction.update(
            doc(db,"users",targetUid),
            {
              followersCount:increment(-1)
            }
          );

          transaction.update(
            doc(db,"users",currentUser.uid),
            {
              followingCount:increment(-1)
            }
          );

        }else{

          transaction.set(
            followerRef,
            {
              uid:currentUser.uid,
              createdAt:serverTimestamp()
            }
          );

          transaction.set(
            followingRef,
            {
              uid:targetUid,
              createdAt:serverTimestamp()
            }
          );

          transaction.update(
            doc(db,"users",targetUid),
            {
              followersCount:increment(1)
            }
          );

          transaction.update(
            doc(db,"users",currentUser.uid),
            {
              followingCount:increment(1)
            }
          );

        }

      }
    );

    const follower =
      await getDoc(followerRef);

    if(follower.exists()){

      await createNotification(
        targetUid,
        "follow",
        `${currentProfile.displayName} followed you.`
      );

    }

    loadProfile(targetUid);

  }catch(err){

    console.error(err);
    toast("Could not update follow.");

  }

};

          </button>

            <div id="editAvatar"
                 class="profile-avatar"
                 style="margin:0">

              ${
                currentProfile.photoURL
                ? `<img src="${currentProfile.photoURL}" alt="">`
                : esc(initials(currentProfile.displayName))
              }

            </div>

            <input id="profilePhotoInput"
                   type="file"

                   hidden>

          </label>

        <div class="field">

          <label>Username</label>

          <input id="editUsername"
                 maxlength="20"
                 value="${esc(currentProfile.username)}">

        </div>

        <div class="field">

          <label>Display name</label>

          <input id="editDisplayName"
                 maxlength="30"
                 value="${esc(currentProfile.displayName)}">

        </div>

        <div class="field">

          <label>Bio</label>

          <textarea id="editBio"
                    maxlength="160"
                    placeholder="Tell people about yourself...">${esc(currentProfile.bio || "")}</textarea>

        </div>

        <div id="editError" class="error"></div>

        <button id="saveProfile"
                class="primary">
          Save changes
        </button>

      </div>

    </div>
  `;


  let newPhoto = null;

  $("profilePhotoInput").onchange =
    async()=>{

      const file =
        $("profilePhotoInput").files[0];

      if(!file) return;

      try{

        newPhoto =
          await compressProfileImage(file);

        $("editAvatar").innerHTML =
          `<img src="${newPhoto}" alt="">`;

      }catch(err){

        $("editError").textContent =
          err.message;

      }

    };


  $("saveProfile").onclick =
    async()=>{

      const username =
        $("editUsername").value.trim();

      const displayName =
        $("editDisplayName").value.trim();

      const bio =
        $("editBio").value.trim();

      const usernameLower =
        username.toLowerCase();

      const displayNameLower =
        displayName.normalize("NFKC").toLowerCase();

      if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){

        $("editError").textContent =
          "Username must be 3–20 characters.";

        return;

      }

      if(displayName.length < 2 || displayName.length > 30){

        $("editError").textContent =
          "Display name must be 2–30 characters.";

        return;

      }

      try{

        const oldUsername =
          currentProfile.usernameLower;

        const oldDisplay =
          currentProfile.displayNameLower;

        await runTransaction(
          db,
          async transaction=>{

            if(usernameLower !== oldUsername){

              const newRef =
                doc(
                  db,
                  "usernames",
                  usernameLower
                );

              const newSnap =
                await transaction.get(newRef);

              if(newSnap.exists())
                throw new Error("USERNAME_TAKEN");

              transaction.delete(
                doc(
                  db,
                  "usernames",
                  oldUsername
                )
              );

              transaction.set(
                newRef,
                {
                  uid:currentUser.uid,
                  username,
                  createdAt:serverTimestamp()
                }
              );

            }

            if(displayNameLower !== oldDisplay){

              const newRef =
                doc(
                  db,
                  "displayNames",
                  displayNameLower
                );

              const newSnap =
                await transaction.get(newRef);

              if(newSnap.exists())
                throw new Error("DISPLAY_TAKEN");

              transaction.delete(
                doc(
                  db,
                  "displayNames",
                  oldDisplay
                )
              );

              transaction.set(
                newRef,
                {
                  uid:currentUser.uid,
                  displayName,
                  createdAt:serverTimestamp()
                }
              );

            }

            transaction.update(
              doc(
                db,
                "users",
                currentUser.uid
              ),
              {
                username,
                usernameLower,
                displayName,
                displayNameLower,
                bio,
                ...(newPhoto
                  ? {photoURL:newPhoto}
                  : {})
              }
            );

          }
        );

        await updateProfile(
          currentUser,
          {
            displayName
          }
        );

        currentProfile =
          (
            await getDoc(
              doc(
                db,
                "users",
                currentUser.uid
              )
            )
          ).data();

        updateGlobalProfileUI();

        $("modalRoot").innerHTML = "";

        loadProfile(currentUser.uid);

        toast("Profile updated.");

      }catch(err){

        $("editError").textContent =
          err.message === "USERNAME_TAKEN"
          ? "Username already taken."
          : err.message === "DISPLAY_TAKEN"
          ? "Display name already taken."
          : err.message;

      }

    };

};


async function compressProfileImage(file){

  if(file.size > 8*1024*1024)
    throw new Error("Image must be smaller than 8 MB.");

  const result =
    await compressImage(file);

  if(result.length > 500000)
    throw new Error(
      "Profile picture is still too large. Choose another image."
    );

  return result;
}


/* DM */

window.startDM = async targetUid=>{

  if(targetUid === currentUser.uid)
    return;

  try{

    const conversationId =
      [
        currentUser.uid,
        targetUid
      ]
      .sort()
      .join("_");

    const conversationRef =
      doc(
        db,
        "conversations",
        conversationId
      );

    const existing =
      await getDoc(conversationRef);

    if(!existing.exists()){

      const targetSnap =
        await getDoc(
          doc(db,"users",targetUid)
        );

      if(!targetSnap.exists()){
        toast("User not found.");
        return;
      }

      await setDoc(
        conversationRef,
        {
          members:[
            currentUser.uid,
            targetUid
          ],
          memberProfiles:{
            [currentUser.uid]:{
              displayName:currentProfile.displayName,
              username:currentProfile.username,
              photoURL:currentProfile.photoURL || ""
            },
            [targetUid]:{
              displayName:targetSnap.data().displayName,
              username:targetSnap.data().username,
              photoURL:targetSnap.data().photoURL || ""
            }
          },
          updatedAt:serverTimestamp(),
          lastMessage:""
        }
      );

    }

    goPage("messages");

    setTimeout(
      ()=>{
        selectConversation(conversationId);
      },
      250
    );

  }catch(err){

    console.error(err);
    toast("Could not start conversation.");

  }

};


/* CONVERSATIONS */

function startConversationListener(){

  if(unsubConversations)
    unsubConversations();

  const q =
    query(
      collection(db,"conversations"),
      where(
        "members",
        "array-contains",
        currentUser.uid
      ),
      limit(50)
    );

  unsubConversations =
    onSnapshot(
      q,
      snapshot=>{

        const conversations =
          snapshot.docs
            .map(d=>({
              id:d.id,
              ...d.data()
            }))
            .sort(
              (a,b)=>
                (b.updatedAt?.seconds || 0)
                -
                (a.updatedAt?.seconds || 0)
            );

        renderConversations(
          conversations
        );

      },
      err=>{
        console.error(err);
      }
    );

}


function renderConversations(items){

  const root =
    $("conversationList");

  if(!items.length){

    root.innerHTML = `
      <div class="muted"
           style="padding:20px">
        No conversations.
      </div>
    `;

    return;

  }

  root.innerHTML =
    items.map(item=>{

      const otherUid =
        item.members.find(
          uid=>uid !== currentUser.uid
        );

      const other =
        item.memberProfiles?.[otherUid]
        || {
          displayName:"User",
          username:"user"
        };

      return `

        <div class="conversation ${
          selectedConversation === item.id
          ? "active"
          : ""
        }"
        onclick="window.selectConversation('${item.id}')">

          ${avatarHTML(other,"38")}

          <div style="min-width:0">

            <strong>
              ${esc(other.displayName)}
            </strong>

            <div class="muted"
                 style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              ${esc(item.lastMessage || "No messages yet")}
            </div>

          </div>

        </div>

      `;

    }).join("");

}


window.selectConversation =
conversationId=>{

  selectConversation(conversationId);

};


async function selectConversation(conversationId){

  selectedConversation =
    conversationId;

  try{

    const snap =
      await getDoc(
        doc(
          db,
          "conversations",
          conversationId
        )
      );

    if(!snap.exists()) return;

    const conversation =
      snap.data();

    const otherUid =
      conversation.members.find(
        uid=>uid !== currentUser.uid
      );

    const other =
      conversation.memberProfiles?.[otherUid]
      || {
        displayName:"User",
        username:"user"
      };

    $("chatHead").innerHTML =
      `${esc(other.displayName)} <span class="muted">@${esc(other.username)}</span>`;

    $("messageInput").disabled = false;
    $("messageForm").querySelector("button").disabled = false;

    if(unsubMessages)
      unsubMessages();

    const q =
      query(
        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        ),
        orderBy("createdAt","asc"),
        limit(200)
      );

    unsubMessages =
      onSnapshot(
        q,
        snapshot=>{

          const messages =
            snapshot.docs.map(d=>({
              id:d.id,
              ...d.data()
            }));

          renderMessages(messages);

        }
      );

    renderConversations([]);

  }catch(err){

    console.error(err);

  }

}


function renderMessages(messages){

  const root =
    $("messagesList");

  if(!messages.length){

    root.innerHTML = `
      <div class="muted"
           style="text-align:center;margin:auto">
        No messages yet.
      </div>
    `;

    return;

  }

  root.innerHTML =
    messages.map(message=>`

      <div class="message ${
        message.senderUid === currentUser.uid
        ? "mine"
        : ""
      }">

        <div>
          ${esc(message.text)}
        </div>

        <div class="message-time">
          ${timeAgo(message.createdAt)}
        </div>

      </div>

    `).join("");

  root.scrollTop =
    root.scrollHeight;

}


/* SEND MESSAGE */

$("messageForm").onsubmit =
async e=>{

  e.preventDefault();

  if(!selectedConversation)
    return;

  const input =
    $("messageInput");

  const text =
    input.value.trim();

  if(!text)
    return;

  try{

    await addDoc(
      collection(
        db,
        "conversations",
        selectedConversation,
        "messages"
      ),
      {
        senderUid:currentUser.uid,
        senderName:currentProfile.displayName,
        text,
        createdAt:serverTimestamp()
      }
    );

    await updateDoc(
      doc(
        db,
        "conversations",
        selectedConversation
      ),
      {
        lastMessage:text,
        updatedAt:serverTimestamp()
      }
    );

    input.value = "";

  }catch(err){

    console.error(err);
    toast("Could not send message.");

  }

};

}
