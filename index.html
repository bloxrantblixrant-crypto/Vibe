<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Alteo</title>

<style>
:root{
  --bg:#08080a;
  --panel:#101014;
  --panel2:#15151b;
  --panel3:#1c1c23;
  --text:#f7f7f8;
  --muted:#92929b;
  --line:rgba(255,255,255,.09);
  --accent:#ffffff;
  --danger:#ff4d67;
  --radius:24px;
  --nav:76px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.hidden{
  display:none!important;
}

/* LOADING */

#loader{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#08080a;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.45s ease;
}

.loader-inner{
  text-align:center;
}

.logo{
  width:62px;
  height:62px;
  border-radius:20px;
  background:#fff;
  color:#08080a;
  display:grid;
  place-items:center;
  font-size:25px;
  font-weight:900;
  margin:auto;
  box-shadow:0 15px 50px rgba(255,255,255,.1);
}

.loader-ring{
  width:26px;
  height:26px;
  border:2px solid rgba(255,255,255,.12);
  border-top-color:#fff;
  border-radius:50%;
  margin:25px auto 0;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* AUTH */

#authScreen{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
  position:relative;
  overflow:hidden;
}

.auth-glow{
  position:absolute;
  width:450px;
  height:450px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.07),transparent 65%);
  filter:blur(20px);
  pointer-events:none;
}

.auth-card{
  width:min(430px,100%);
  background:rgba(16,16,20,.88);
  border:1px solid var(--line);
  border-radius:30px;
  padding:32px;
  position:relative;
  z-index:1;
  box-shadow:0 35px 100px rgba(0,0,0,.45);
  backdrop-filter:blur(30px);
  animation:authIn .6s cubic-bezier(.2,.8,.2,1);
}

@keyframes authIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.97);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.auth-brand{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:30px;
}

.auth-brand .logo{
  width:48px;
  height:48px;
  border-radius:15px;
  font-size:19px;
  margin:0;
}

.auth-brand-name{
  font-size:24px;
  font-weight:800;
  letter-spacing:-.7px;
}

.auth-title{
  font-size:30px;
  letter-spacing:-1px;
  margin:0 0 8px;
}

.auth-subtitle{
  color:var(--muted);
  margin:0 0 25px;
  line-height:1.5;
}

.auth-form{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.input-wrap{
  position:relative;
}

.input{
  width:100%;
  background:#18181d;
  color:#fff;
  border:1px solid transparent;
  outline:0;
  padding:15px 16px;
  border-radius:15px;
  transition:.2s;
}

.input:focus{
  border-color:rgba(255,255,255,.25);
  background:#1b1b21;
  box-shadow:0 0 0 4px rgba(255,255,255,.035);
}

.primary-btn{
  width:100%;
  background:#fff;
  color:#08080a;
  padding:15px;
  border-radius:15px;
  font-weight:750;
  transition:.2s;
}

.primary-btn:hover{
  transform:translateY(-1px);
}

.primary-btn:active{
  transform:scale(.98);
}

.google-btn{
  width:100%;
  background:#18181d;
  color:#fff;
  border:1px solid var(--line);
  padding:14px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-weight:650;
  transition:.2s;
}

.google-btn:hover{
  background:#202027;
}

.google-icon{
  width:19px;
  height:19px;
  font-weight:800;
  display:grid;
  place-items:center;
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  color:#65656d;
  font-size:12px;
  margin:18px 0;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  background:var(--line);
  flex:1;
}

.auth-switch{
  color:var(--muted);
  text-align:center;
  font-size:14px;
  margin:20px 0 0;
}

.auth-switch button{
  background:none;
  color:#fff;
  font-weight:700;
  padding:0;
}

.auth-error{
  display:none;
  background:rgba(255,77,103,.1);
  border:1px solid rgba(255,77,103,.18);
  color:#ff8799;
  padding:12px 14px;
  border-radius:13px;
  font-size:13px;
  line-height:1.4;
}

/* APP */

#app{
  display:none;
  min-height:100vh;
}

.app-layout{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:260px;
  height:100vh;
  position:fixed;
  left:0;
  top:0;
  padding:25px 16px;
  border-right:1px solid var(--line);
  background:rgba(8,8,10,.9);
  backdrop-filter:blur(25px);
  z-index:50;
}

.side-brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:5px 10px 35px;
}

.side-logo{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#fff;
  color:#000;
  display:grid;
  place-items:center;
  font-weight:900;
}

.side-name{
  font-weight:800;
  font-size:20px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.nav-btn{
  color:#8d8d96;
  background:transparent;
  width:100%;
  padding:13px 14px;
  border-radius:14px;
  display:flex;
  align-items:center;
  gap:13px;
  font-weight:650;
  text-align:left;
  transition:.2s;
}

.nav-btn:hover{
  color:#fff;
  background:#141419;
}

.nav-btn.active{
  color:#fff;
  background:#19191f;
}

.sidebar-profile{
  position:absolute;
  left:16px;
  right:16px;
  bottom:18px;
  padding:10px;
  border-radius:16px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.sidebar-profile:hover{
  background:#141419;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#222228;
  overflow:hidden;
  flex:none;
  display:grid;
  place-items:center;
  color:#aaa;
  font-weight:750;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.side-user{
  min-width:0;
}

.side-display{
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.side-username{
  color:#707078;
  font-size:12px;
  margin-top:2px;
}

/* MAIN */

.main{
  margin-left:260px;
  width:calc(100% - 260px);
  min-height:100vh;
}

.content{
  width:min(760px,100%);
  margin:auto;
  padding:28px 22px 100px;
}

.topbar{
  height:55px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.page-title{
  font-size:28px;
  font-weight:800;
  letter-spacing:-1px;
}

.mobile-logo{
  display:none;
}

/* FEED */

.composer{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  padding:16px;
  margin-bottom:18px;
}

.composer-top{
  display:flex;
  gap:12px;
}

.composer textarea{
  flex:1;
  min-height:55px;
  resize:none;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
  padding:10px 0;
  font-size:15px;
}

.composer textarea::placeholder{
  color:#6e6e77;
}

.composer-bottom{
  border-top:1px solid var(--line);
  margin-top:10px;
  padding-top:12px;
  display:flex;
  justify-content:flex-end;
}

.post-btn{
  background:#fff;
  color:#000;
  padding:9px 17px;
  border-radius:12px;
  font-size:13px;
  font-weight:750;
}

.post{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  padding:17px;
  margin-bottom:15px;
  animation:postIn .35s ease;
}

@keyframes postIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.post-head{
  display:flex;
  align-items:center;
  gap:11px;
}

.post-user{
  min-width:0;
}

.post-display{
  font-weight:750;
  font-size:14px;
}

.post-username{
  color:#777780;
  font-size:12px;
  margin-top:2px;
}

.post-time{
  color:#66666e;
  font-size:12px;
  margin-left:auto;
}

.post-content{
  font-size:15px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
  margin:15px 2px 13px;
}

.post-actions{
  display:flex;
  gap:5px;
  border-top:1px solid var(--line);
  padding-top:11px;
}

.post-action{
  background:transparent;
  color:#777780;
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 9px;
  border-radius:10px;
  font-size:12px;
}

.post-action:hover{
  background:#19191f;
  color:#fff;
}

.post-action.liked{
  color:#fff;
}

/* SEARCH */

.search-box{
  position:relative;
  margin-bottom:18px;
}

.search-box svg{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:#707078;
}

.search-input{
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  outline:0;
  color:#fff;
  border-radius:17px;
  padding:15px 15px 15px 46px;
}

.search-results{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.user-result{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:13px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  transition:.2s;
}

.user-result:hover{
  background:#16161b;
}

.result-info{
  min-width:0;
}

.result-name{
  font-weight:750;
  font-size:14px;
}

.result-username{
  color:#777780;
  font-size:12px;
  margin-top:3px;
}

.empty{
  text-align:center;
  color:#686870;
  padding:50px 20px;
  font-size:14px;
}

/* PROFILE */

.profile-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:26px;
  overflow:hidden;
}

.profile-cover{
  height:145px;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.12),transparent 35%),
    radial-gradient(circle at 80% 80%,rgba(255,255,255,.07),transparent 35%),
    #17171c;
}

.profile-main{
  padding:0 22px 22px;
}

.profile-avatar-wrap{
  margin-top:-42px;
  position:relative;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}

.profile-avatar{
  width:84px;
  height:84px;
  border:4px solid var(--panel);
  border-radius:50%;
}

.edit-profile-btn{
  background:#fff;
  color:#000;
  padding:9px 15px;
  border-radius:12px;
  font-size:13px;
  font-weight:750;
}

.profile-name{
  font-size:23px;
  font-weight:800;
  margin-top:14px;
  letter-spacing:-.5px;
}

.profile-handle{
  color:#777780;
  font-size:14px;
  margin-top:3px;
}

.profile-bio{
  color:#c4c4c9;
  font-size:14px;
  line-height:1.55;
  margin-top:14px;
  white-space:pre-wrap;
}

.profile-stats{
  display:flex;
  gap:30px;
  margin-top:20px;
}

.stat strong{
  display:block;
  font-size:16px;
}

.stat span{
  display:block;
  color:#6f6f77;
  font-size:12px;
  margin-top:3px;
}

/* MODAL */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(12px);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  animation:fadeIn .2s ease;
}

.modal{
  width:min(480px,100%);
  max-height:90vh;
  overflow:auto;
  background:#111115;
  border:1px solid var(--line);
  border-radius:27px;
  padding:24px;
  box-shadow:0 35px 100px rgba(0,0,0,.55);
  animation:modalIn .3s cubic-bezier(.2,.8,.2,1);
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(20px) scale(.96);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.modal-title{
  font-size:21px;
  font-weight:800;
}

.icon-btn{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#1b1b21;
  color:#aaa;
  display:grid;
  place-items:center;
}

.icon-btn:hover{
  color:#fff;
  background:#222229;
}

.profile-edit-avatar{
  display:flex;
  justify-content:center;
  margin:5px 0 22px;
}

.edit-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#202027;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  border:2px solid rgba(255,255,255,.1);
}

.edit-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.edit-avatar-overlay{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:rgba(0,0,0,.45);
  opacity:0;
  transition:.2s;
}

.edit-avatar:hover .edit-avatar-overlay{
  opacity:1;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  color:#9999a2;
  font-size:12px;
  margin:0 0 7px 3px;
}

.field input,
.field textarea{
  width:100%;
  background:#19191f;
  color:#fff;
  border:1px solid transparent;
  outline:0;
  border-radius:14px;
  padding:13px;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:rgba(255,255,255,.2);
}

.field-help{
  color:#66666e;
  font-size:11px;
  margin-top:6px;
  padding-left:3px;
}

.modal-error{
  color:#ff7d91;
  font-size:12px;
  line-height:1.45;
  margin:10px 2px;
  display:none;
}

.save-btn{
  width:100%;
  padding:14px;
  border-radius:14px;
  background:#fff;
  color:#000;
  font-weight:750;
  margin-top:5px;
}

/* MOBILE NAV */

.mobile-nav{
  display:none;
}

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translate(-50%,20px);
  background:#fff;
  color:#000;
  padding:12px 17px;
  border-radius:14px;
  font-size:13px;
  font-weight:700;
  z-index:1000;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  box-shadow:0 15px 45px rgba(0,0,0,.35);
  max-width:calc(100% - 30px);
  text-align:center;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* RESPONSIVE */

@media(max-width:800px){
  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .content{
    padding:18px 15px 95px;
  }

  .mobile-nav{
    position:fixed;
    display:flex;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:rgba(10,10,12,.91);
    backdrop-filter:blur(25px);
    border-top:1px solid var(--line);
    z-index:100;
    padding-bottom:env(safe-area-inset-bottom);
  }

  .mobile-nav button{
    flex:1;
    background:transparent;
    color:#6d6d75;
    display:grid;
    place-items:center;
    align-content:center;
    gap:4px;
  }

  .mobile-nav button.active{
    color:#fff;
  }

  .mobile-nav span{
    font-size:10px;
    font-weight:650;
  }

  .mobile-logo{
    display:flex;
    align-items:center;
    gap:9px;
  }

  .mobile-logo-box{
    width:35px;
    height:35px;
    border-radius:11px;
    background:#fff;
    color:#000;
    display:grid;
    place-items:center;
    font-size:13px;
    font-weight:900;
  }

  .page-title{
    display:none;
  }

  .topbar{
    margin-bottom:18px;
  }
}

@media(max-width:480px){
  .auth-card{
    padding:25px 20px;
    border-radius:24px;
  }

  .auth-title{
    font-size:27px;
  }

  .post{
    border-radius:19px;
    padding:14px;
  }

  .composer{
    border-radius:19px;
  }

  .profile-cover{
    height:120px;
  }
}
</style>
</head>

/* =========================================================
   HELPERS
========================================================= */

function showToast(message){

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(()=>{
    toast.classList.remove("show");
  },2500);
}


function showAuthError(message){

  authError.textContent = message;
  authError.style.display = "block";
}


function clearAuthError(){

  authError.textContent = "";
  authError.style.display = "none";
}


function showProfileError(message){

  profileError.textContent = message;
  profileError.style.display = "block";
}


function clearProfileError(){

  profileError.textContent = "";
  profileError.style.display = "none";
}


function normalizeUsername(value){

  return value.trim().toLowerCase();
}


function normalizeDisplayName(value){

  return value
    .trim()
    .normalize("NFKC")
    .toLowerCase();
}


function validUsername(value){

  return /^[a-zA-Z0-9_]{3,20}$/.test(value);
}


function validDisplayName(value){

  const length = value.trim().length;

  return length >= 2 && length <= 30;
}


function escapeHTML(value){

  const div = document.createElement("div");
  div.textContent = value ?? "";

  return div.innerHTML;
}


function initials(name){

  const text = (name || "A").trim();

  if(!text) return "A";

  return text
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();
}


/* =========================================================
   AVATARS
========================================================= */

function setAvatar(element, profile){

  if(!element) return;

  const photo = profile?.photoURL;

  if(photo){

    element.innerHTML = `
      <img
        src="${photo}"
        alt=""
        loading="lazy"
      >
    `;

  }else{

    element.textContent = initials(
      profile?.displayName ||
      profile?.username ||
      "A"
    );

  }
}


/* =========================================================
   AUTH UI
========================================================= */

function setAuthMode(mode){

  authMode = mode;

  clearAuthError();

  const signup = mode === "signup";

  displayNameWrap.classList.toggle("hidden", !signup);
  usernameWrap.classList.toggle("hidden", !signup);

  if(signup){

    authTitle.textContent = "Create your account.";

    authSubmit.textContent = "Create account";

    switchText.textContent = "Already have an account?";

    passwordInput.autocomplete = "new-password";

  }else{

    authTitle.textContent = "Welcome back.";
    authSubtitle.textContent =
      "Log in to your Alteo account.";

    authSubmit.textContent = "Log in";

    switchText.textContent = "Don't have an account?";
    switchAuth.textContent = "Create one";

    passwordInput.autocomplete = "current-password";
  }
}


switchAuth.addEventListener("click",()=>{

  setAuthMode(
    authMode === "login"
      ? "signup"
      : "login"
  );

});


/* =========================================================
   EMAIL AUTH
========================================================= */

authForm.addEventListener("submit",async event=>{

  event.preventDefault();

  clearAuthError();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(!email || !password){

    showAuthError("Enter your email and password.");
    return;
  }

  authSubmit.disabled = true;
  authSubmit.textContent =
    authMode === "signup"
      ? "Creating..."
      : "Logging in...";

  try{

    if(authMode === "signup"){

      const displayName = displayNameInput.value.trim();
      const username = usernameInput.value.trim();

      if(!validUsername(username)){

        throw new Error(
          "Username must be 3–20 characters and only use letters, numbers or underscores."
        );

      }

      if(!validDisplayName(displayName)){

        throw new Error(
          "Display name must be between 2 and 30 characters."
        );

      }

      const credential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      await createProfileAtomically(
        credential.user,
        username,
        displayName,
        ""
      );

      await updateProfile(
        credential.user,
        {
          displayName: displayName
        }
      );

    }else{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }

  }catch(error){

    console.error(error);

    showAuthError(
      friendlyFirebaseError(error)
    );

  }finally{

    authSubmit.disabled = false;

    authSubmit.textContent =
      authMode === "signup"
        ? "Create account"
        : "Log in";

  }

});


/* =========================================================
   GOOGLE LOGIN
========================================================= */

googleBtn.addEventListener("click",async()=>{

  clearAuthError();

  googleBtn.disabled = true;
  googleBtn.textContent = "Connecting...";

  try{

    await signInWithPopup(
      auth,
      googleProvider
    );

  }catch(error){

    console.error(error);

    /*
      Some mobile browsers block popup authentication.
      Redirect is used as a fallback.
    */

    if(
      error.code === "auth/popup-blocked" ||
      error.code === "auth/popup-closed-by-user" ||
      error.code === "auth/cancelled-popup-request"
    ){

      try{

        await signInWithRedirect(
          auth,
          googleProvider
        );

      }catch(redirectError){

        showAuthError(
          friendlyFirebaseError(redirectError)
        );

      }

    }else{

      showAuthError(
        friendlyFirebaseError(error)
      );

    }

  }finally{

    googleBtn.disabled = false;
    googleBtn.innerHTML =
      '<span class="google-icon">G</span> Continue with Google';

  }

});


/* =========================================================
   FIREBASE ERRORS
========================================================= */

function friendlyFirebaseError(error){

  const code = error?.code || "";

  const messages = {

    "auth/invalid-email":
      "That email address is not valid.",

    "auth/email-already-in-use":
      "That email is already registered.",

    "auth/weak-password":
      "Your password is too weak. Use a stronger password.",

    "auth/invalid-credential":
      "The email or password is incorrect.",

    "auth/wrong-password":
      "The email or password is incorrect.",

    "auth/user-not-found":
      "The email or password is incorrect.",

    "auth/network-request-failed":
      "Network error. Check your internet connection.",

    "auth/popup-blocked":
      "The Google sign-in popup was blocked.",

    "auth/popup-closed-by-user":
      "Google sign-in was cancelled.",

    "auth/operation-not-allowed":
      "This sign-in method is not enabled in Firebase."

  };

  return messages[code] ||
    error?.message ||
    "Something went wrong. Try again.";

}


/* =========================================================
   PROFILE CREATION
========================================================= */

async function createProfileAtomically(
  user,
  username,
  displayName,
  bio = "",
  photoURL = ""
){

  const usernameLower =
    normalizeUsername(username);

  const displayNameLower =
    normalizeDisplayName(displayName);

  const userRef =
    doc(db,"users",user.uid);

  const usernameRef =
    doc(db,"usernames",usernameLower);

  const displayNameRef =
    doc(db,"displayNames",displayNameLower);

  await runTransaction(db,async transaction=>{

    const usernameSnap =
      await transaction.get(usernameRef);

    const displayNameSnap =
      await transaction.get(displayNameRef);

    if(usernameSnap.exists()){

      throw new Error(
        "That username is already taken."
      );

    }

    if(displayNameSnap.exists()){

      throw new Error(
        "That display name is already taken."
      );

    }

    transaction.set(
      usernameRef,
      {
        uid:user.uid,
        createdAt:serverTimestamp()
      }
    );

    transaction.set(
      displayNameRef,
      {
        uid:user.uid,
        createdAt:serverTimestamp()
      }
    );

    transaction.set(
      userRef,
      {
        uid:user.uid,
        email:user.email || "",
        username:username,
        usernameLower:usernameLower,
        displayName:displayName,
        displayNameLower:displayNameLower,
        bio:bio,
        photoURL:photoURL,
        createdAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      }
    );

  });

}

  const snap =

  if(snap.exists()){

    currentProfile = snap.data();

    return true;

  }

  return false;
}

/* =========================================================
   SAVE PROFILE
========================================================= */

async function saveProfile(){

  if(!currentUser) return;

  clearProfileError();

  const username =
    editUsername.value.trim();

  const displayName =
    editDisplayName.value.trim();

  const bio =
    editBio.value.trim();

  if(!validUsername(username)){

    showProfileError(
      "Username must be 3–20 characters and only use letters, numbers or underscores."
    );

    return;
  }

  if(!validDisplayName(displayName)){

    showProfileError(
      "Display name must be between 2 and 30 characters."
    );

    return;
  }

  saveProfileBtn.disabled = true;
  saveProfileBtn.textContent = "Saving...";

  try{

    const usernameLower =
      normalizeUsername(username);

    const displayNameLower =
      normalizeDisplayName(displayName);

    const userRef =
      doc(db,"users",currentUser.uid);

    /*
      FIRST PROFILE
    */

    if(!currentProfile){

      await createProfileAtomically(
        currentUser,
        username,
        displayName,
        bio,
        selectedPhotoData || ""
      );

    }else{

      const oldUsername =
        currentProfile.usernameLower ||
        normalizeUsername(currentProfile.username || "");

      const oldDisplayName =
        currentProfile.displayNameLower ||
        normalizeDisplayName(currentProfile.displayName || "");

      const usernameChanged =
        usernameLower !== oldUsername;

      const displayNameChanged =
        displayNameLower !== oldDisplayName;

      const newUsernameRef =
        doc(db,"usernames",usernameLower);

      const newDisplayNameRef =
        doc(db,"displayNames",displayNameLower);

      const oldUsernameRef =
        doc(db,"usernames",oldUsername);

      const oldDisplayNameRef =
        doc(db,"displayNames",oldDisplayName);

      await runTransaction(db,async transaction=>{

        if(usernameChanged){

          const usernameSnap =
            await transaction.get(newUsernameRef);

          if(
            usernameSnap.exists() &&
            usernameSnap.data().uid !== currentUser.uid
          ){

            throw new Error(
              "That username is already taken."
            );

          }

        }

        if(displayNameChanged){

          const displayNameSnap =
            await transaction.get(newDisplayNameRef);

          if(
            displayNameSnap.exists() &&
            displayNameSnap.data().uid !== currentUser.uid
          ){

            throw new Error(
              "That display name is already taken."
            );

          }

        }

        if(usernameChanged){

          transaction.set(
            newUsernameRef,
            {
              uid:currentUser.uid,
              createdAt:serverTimestamp()
            }
          );

          transaction.delete(
            oldUsernameRef
          );

        }

        if(displayNameChanged){

          transaction.set(
            newDisplayNameRef,
            {
              uid:currentUser.uid,
              createdAt:serverTimestamp()
            }
          );

          transaction.delete(
            oldDisplayNameRef
          );

        }

        transaction.update(
          userRef,
          {
            username:username,
            usernameLower:usernameLower,
            displayName:displayName,
            displayNameLower:displayNameLower,
            bio:bio,
            photoURL:selectedPhotoData || "",
            updatedAt:serverTimestamp()
          }
        );

      });

    }

    await updateProfile(
      currentUser,
      {
        displayName:displayName,
        photoURL:selectedPhotoData || null
      }
    );

    await loadProfile(currentUser);

    profileSetupMode = false;

    closeModal();

    updateAllUI();

    showToast("Profile updated");

  }catch(error){

    console.error(error);

    showProfileError(
      error.message ||
      "Could not save your profile."
    );

  }finally{

    saveProfileBtn.disabled = false;
    saveProfileBtn.textContent =
      "Save changes";

  }

}


/* =========================================================
   PROFILE PICTURE
   FIRESTORE ONLY
========================================================= */

photoInput.addEventListener("change",event=>{

  const file =
    event.target.files?.[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){

    showProfileError(
      "Please select an image."
    );

    return;
  }

  /*
    Limit original file size before processing.
    The final Base64 image will be much smaller.
  */

  if(file.size > 8 * 1024 * 1024){

    showProfileError(
      "That image is too large. Choose an image under 8 MB."
    );

    return;
  }

  compressImage(file)
    .then(dataURL=>{

      selectedPhotoData = dataURL;

      editAvatar.innerHTML =
        `<img src="${dataURL}" alt="">`;

    })
    .catch(error=>{

      console.error(error);

      showProfileError(
        "Could not process that image."
      );

    });

});


function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload = event=>{

      const img =
        new Image();

      img.onload = ()=>{

        const maxSize = 420;

        let width =
          img.width;

        let height =
          img.height;

        if(width > height){

          if(width > maxSize){

            height =
              Math.round(
                height * maxSize / width
              );

            width = maxSize;

          }

        }else{

          if(height > maxSize){

            width =
              Math.round(
                width * maxSize / height
              );

            height = maxSize;

          }

        }

        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        /*
          JPEG keeps the Firestore document
          much smaller than the original image.
        */

        const dataURL =
          canvas.toDataURL(
            "image/jpeg",
            .72
          );

        /*
          Safety check.
          Firestore document size is ~1 MiB.
        */

        if(dataURL.length > 700000){

          const smaller =
            canvas.toDataURL(
              "image/jpeg",
              .5
            );

          resolve(smaller);

        }else{

          resolve(dataURL);

        }

      };

      img.onerror =
        reject;

      img.src =
        event.target.result;

    };

    reader.onerror =
      reject;

    reader.readAsDataURL(file);

  });

}

/* =========================================================
   FEED
========================================================= */

function startFeed(){

  if(unsubscribePosts){

    unsubscribePosts();

    unsubscribePosts = null;

  }

  const postsQuery =
    query(
      collection(db,"posts"),
      orderBy("createdAt","desc"),
      limit(50)
    );

  unsubscribePosts =
    onSnapshot(
      postsQuery,
      snapshot=>{

        feed.innerHTML = "";

        if(snapshot.empty){

          feed.innerHTML = `
            <div class="empty">
              Be the first person to post.
            </div>
          `;

          return;
        }

        snapshot.forEach(docSnap=>{

          const post =
            docSnap.data();

          renderPost(
            docSnap.id,
            post
          );

        });

      },
      error=>{

        console.error(error);

        feed.innerHTML = `
          <div class="empty">
            Couldn't load the feed.
          </div>
        `;

      }
    );

}


function renderPost(id,post){

  const article =
    document.createElement("article");

  article.className = "post";

  const date =
    post.createdAt?.toDate
      ? post.createdAt.toDate()
      : null;

  const time =
    date
      ? formatTime(date)
      : "now";

  const avatarHTML =
    post.photoURL
      ? `<div class="avatar">
          <img src="${post.photoURL}" alt="" loading="lazy">
         </div>`
      : `<div class="avatar">
          ${escapeHTML(
            initials(
              post.displayName ||
              post.username
            )
          )}
         </div>`;

  article.innerHTML = `

    <div class="post-head">

      ${avatarHTML}

      <div class="post-user">

        <div class="post-display">
          ${escapeHTML(
            post.displayName ||
            post.username ||
            "Alteo user"
          )}
        </div>

        <div class="post-username">
          @${escapeHTML(
            post.username || ""
          )}
        </div>

      </div>

      <div class="post-time">
        ${time}
      </div>

    </div>

    <div class="post-content">
      ${escapeHTML(post.text || "")}
    </div>

    <div class="post-actions">

      <button class="post-action like-btn">
        <svg><use href="#i-heart"></use></svg>
        <span>0</span>
      </button>

      <button class="post-action">
        <svg><use href="#i-comment"></use></svg>
        <span>Reply</span>
      </button>

      <button class="post-action">
        <svg><use href="#i-send"></use></svg>
        <span>Share</span>
      </button>

    </div>

  `;

  const likeButton =
    article.querySelector(".like-btn");

  likeButton.addEventListener(
    "click",
    ()=>{
      likeButton.classList.toggle("liked");

      const span =
        likeButton.querySelector("span");

      span.textContent =
        likeButton.classList.contains("liked")
          ? "1"
          : "0";
    }
  );

  feed.appendChild(article);

}


function formatTime(date){

  const seconds =
    Math.floor(
      (Date.now() - date.getTime()) / 1000
    );

  if(seconds < 10)
    return "now";

  if(seconds < 60)
    return seconds + "s";

  const minutes =
    Math.floor(seconds / 60);

  if(minutes < 60)
    return minutes + "m";

  const hours =
    Math.floor(minutes / 60);

  if(hours < 24)
    return hours + "h";

  const days =
    Math.floor(hours / 24);

  if(days < 7)
    return days + "d";

  return date.toLocaleDateString();
}


/* =========================================================
   SEARCH USERS
========================================================= */

let searchTimer = null;

searchInput.addEventListener(
  "input",
  ()=>{

    clearTimeout(searchTimer);

    const value =
      searchInput.value.trim();

    if(!value){

      searchResults.innerHTML = `
        <div class="empty">
          Search for an Alteo user.
        </div>
      `;

      return;
    }

    searchTimer =
      setTimeout(
        ()=>searchUsers(value),
        350
      );

  }
);


async function searchUsers(value){

  searchResults.innerHTML = `
    <div class="empty">
      Searching...
    </div>
  `;

  const normalized =
    value.toLowerCase();

  try{

    /*
      Prefix search for usernames.
    */

    const usernameQuery =
      query(
        collection(db,"users"),
        where(
          "usernameLower",
          ">=",
          normalized
        ),
        where(
          "usernameLower",
          "<=",
          normalized + "\uf8ff"
        ),
        limit(10)
      );

    /*
      Prefix search for display names.
    */

    const displayQuery =
      query(
        collection(db,"users"),
        where(
          "displayNameLower",
          ">=",
          normalizeDisplayName(value)
        ),
        where(
          "displayNameLower",
          "<=",
          normalizeDisplayName(value) + "\uf8ff"
        ),
        limit(10)
      );

    const [
      usernameSnap,
      displaySnap
    ] = await Promise.all([
      getDocs(usernameQuery),
      getDocs(displayQuery)
    ]);

    const users = new Map();

    usernameSnap.forEach(
      snap=>{
        users.set(
          snap.id,
          snap.data()
        );
      }
    );

    displaySnap.forEach(
      snap=>{
        users.set(
          snap.id,
          snap.data()
        );
      }
    );

    searchResults.innerHTML = "";

    if(users.size === 0){

      searchResults.innerHTML = `
        <div class="empty">
          No users found.
        </div>
      `;

      return;
    }

    users.forEach(user=>{

      const item =
        document.createElement("div");

      item.className = "user-result";

      const avatar =
        document.createElement("div");

      avatar.className = "avatar";

      setAvatar(
        avatar,
        user
      );

      const info =
        document.createElement("div");

      info.className = "result-info";

      info.innerHTML = `
        <div class="result-name">
          ${escapeHTML(
            user.displayName ||
            user.username
          )}
        </div>

        <div class="result-username">
          @${escapeHTML(
            user.username || ""
          )}
        </div>
      `;

      item.appendChild(avatar);
      item.appendChild(info);

      item.addEventListener(
        "click",
        ()=>{
          /*
            For now clicking a user
            takes you to the profile page.
          */
          openPage("profile");

          if(user.uid === currentUser?.uid){

            return;
          }

          showToast(
            "Profile viewing is ready for the next update."
          );

        }
      );

      searchResults.appendChild(item);

    });

  }catch(error){

    console.error(error);

    searchResults.innerHTML = `
      <div class="empty">
        Search couldn't be completed.
      </div>
    `;

  }

}

/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async user=>{

    currentUser = user;

    if(!user){

      currentProfile = null;

      if(unsubscribePosts){

        unsubscribePosts();
        unsubscribePosts = null;

      }

      appScreen.style.display = "none";
      authScreen.style.display = "flex";

      loader.style.opacity = "0";

      setTimeout(
        ()=>loader.style.display = "none",
        450
      );

      return;
    }

    try{

      const exists =
        await loadProfile(user);

      if(!exists){

        /*
          New Google user needs to choose
          their unique username/display name.
        */

        appScreen.style.display = "none";
        authScreen.style.display = "none";

        await setupGoogleProfile(user);

      }else{

        profileSetupMode = false;

        authScreen.style.display = "none";
        appScreen.style.display = "block";

        updateAllUI();

        startFeed();

        loadPostCount();

      }

    }catch(error){

      console.error(error);

      showToast(
        "Couldn't load your profile."
      );

    }finally{

      loader.style.opacity = "0";

      setTimeout(
        ()=>loader.style.display = "none",
        450
      );

    }

  }
);
